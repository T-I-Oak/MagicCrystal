<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Magic Crystal</title>
    <style>
        html,
        body {
            --safe-area-inset-top: env(safe-area-inset-top);
            --safe-area-inset-right: env(safe-area-inset-right);
            --safe-area-inset-bottom: env(safe-area-inset-bottom);
            --safe-area-inset-left: env(safe-area-inset-left);
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            /* Prevent scrolling */
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            height: -webkit-fill-available;
            /* Safari dynamic height */
            font-family: 'Courier New', monospace;
            color: #fff;
            touch-action: none;
            /* Prevent default touch actions like scroll/zoom */
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        #viewport {
            position: relative;
            width: 100%;
            height: 100%;
            height: -webkit-fill-available;
            height: 100dvh;
            display: block;
            /* Disable Flex centering */
            overflow: hidden;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        #game-layer {
            position: absolute;
            top: var(--safe-area-inset-top);
            right: var(--safe-area-inset-right);
            bottom: var(--safe-area-inset-bottom);
            left: var(--safe-area-inset-left);
            overflow: hidden;
            /* Safe-area-bounded container for the scaled game canvas. */
        }

        #game-container {
            position: absolute;
            left: 0;
            /* Will be set by JS precisely */
            top: 0;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            background-color: #000;
            border: 4px solid #4e4e6a;
            border-radius: 8px;
            box-sizing: content-box;
        }

        canvas {
            display: block;
            background-color: #000;
            image-rendering: auto;
            width: 960px;
            height: 660px;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        /* Touch Controls Overlay */
        #touch-controls {
            position: absolute;
            top: var(--safe-area-inset-top);
            right: var(--safe-area-inset-right);
            bottom: var(--safe-area-inset-bottom);
            left: var(--safe-area-inset-left);
            pointer-events: none;
            /* Let touches pass through to game/canvas if not on buttons */
            z-index: 100;
        }

        /* Numpad Grid (3x3) - Container for buttons */
        .numpad-grid {
            position: absolute;
            /* Absolute positioning controlled by JS */
            display: grid;
            grid-template-columns: 80px 80px 80px;
            grid-template-rows: 80px 80px 80px;
            gap: 15px;
            pointer-events: auto;
            /* Re-enable pointer events for buttons */
            transform-origin: center center;
            /* Scale from center to maintain drag alignment */
        }

        /* Secondary pad default hidden, controlled by JS */
        .secondary-pad {
            display: none;
        }

        /* Button Styles */
        #touch-controls .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: #ddd;
            border-radius: 10px;
            width: 100%;
            height: 100%;
            font-size: 32px;
            pointer-events: auto;
            touch-action: manipulation;
            user-select: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        #touch-controls .btn:active,
        #touch-controls .btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Specific Button Styles */
        .smart-q,
        .smart-e {
            background: rgba(255, 200, 0, 0.15) !important;
            border-color: rgba(255, 200, 0, 0.4) !important;
            font-size: 28px !important;
        }

        .action-b {
            background: rgba(255, 80, 80, 0.2) !important;
            border-radius: 50% !important;
        }

        .action-a {
            background: rgba(80, 80, 255, 0.2) !important;
            border-radius: 50% !important;
        }

        /* Drag Handle */
        .drag-handle {
            visibility: hidden;
            /* Use visibility to keep layout space */
            display: flex;
            justify-content: center;
            align-items: center;
            color: transparent;
            /* Text hidden */
            font-size: 40px;
            cursor: move;
            user-select: none;
            touch-action: none;
            background: rgba(255, 255, 0, 0.1);
            /* Faint yellow fill */
            border-radius: 50%;
            border: 3px solid #ff0;
            /* Thick yellow border */
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            /* Include border in size */
        }

        /* Visible state class */
        .drag-handle.visible {
            visibility: visible;
        }

        /* Hide controls on Non-Touch if desired, but kept for testing */
        @media (hover: hover) and (pointer: fine) {
            /* PC: Optional styling updates if needed */
        }

        #share-confirm-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            box-sizing: border-box;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.72);
        }

        #share-confirm-overlay.state-hidden,
        #share-confirm-overlay[hidden] {
            display: none;
        }

        .share-confirm-dialog {
            width: min(520px, calc(100vw - 48px));
            max-height: calc(100dvh - max(32px, env(safe-area-inset-top) + env(safe-area-inset-bottom)));
            overflow-y: auto;
            padding: 28px;
            border: 2px solid #666;
            border-radius: 10px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.92);
            box-shadow: 0 0 24px rgba(0, 0, 0, 0.65);
            color: #ccc;
            text-align: center;
            font-family: monospace;
        }

        .share-confirm-dialog h2 {
            margin: 0 0 18px;
            font: 700 28px monospace;
            line-height: 1.2;
            color: #fff;
        }

        .share-confirm-dialog p {
            margin: 0 0 24px;
            font: 18px monospace;
            line-height: 1.65;
            white-space: pre-line;
            color: #ccc;
        }

        .share-confirm-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .share-confirm-actions button {
            min-width: 150px;
            padding: 12px 18px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font: 700 20px monospace;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .share-confirm-actions .primary {
            border-color: rgba(255, 255, 255, 0.3);
            color: #fff;
        }

        .share-key-face {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border: 2px solid rgba(120, 120, 255, 0.6);
            border-radius: 50%;
            box-sizing: border-box;
            background: rgba(80, 80, 255, 0.3);
            color: #fff;
            font: 700 20px monospace;
            line-height: 1;
            flex: 0 0 auto;
        }

        .share-key-face.cancel {
            border-color: rgba(255, 120, 120, 0.6);
            background: rgba(255, 80, 80, 0.3);
        }

        .share-button-label {
            line-height: 1;
        }
    </style>
  <script type="module" crossorigin src="/MagicCrystal/assets/index-BXgKYCbB.js"></script>
</head>

<body>
    <select id="language-selector" hidden aria-hidden="true"></select>
    <div id="viewport">
        <div id="game-layer">
            <div id="game-container">
                <canvas id="game-canvas" width="960" height="660"></canvas>
            </div>
        </div>

        <!-- Touch Controls (Overlay) -->
        <div id="touch-controls">
            <!-- Primary Pad -->
            <div class="numpad-grid primary-pad">
                <!-- Row 7, 8, 9 -->
                <button class="btn smart-q" data-key="q">↖</button>
                <button class="btn d-up" data-key="ArrowUp">▲</button>
                <button class="btn smart-e" data-key="e">↗</button>

                <!-- Row 4, 5, 6 -->
                <button class="btn d-left" data-key="ArrowLeft">◀</button>
                <div class="drag-handle"></div>
                <button class="btn d-right" data-key="ArrowRight">▶</button>

                <!-- Row 1, 2, 3 -->
                <button class="btn action-a" data-key="z">A</button>
                <button class="btn d-down" data-key="ArrowDown">▼</button>
                <button class="btn action-b" data-key="x">B</button>
            </div>

            <!-- Secondary Pad (For Dual Mode) -->
            <div class="numpad-grid secondary-pad">
                <!-- Row 7, 8, 9 -->
                <button class="btn smart-q" data-key="q">↖</button>
                <button class="btn d-up" data-key="ArrowUp">▲</button>
                <button class="btn smart-e" data-key="e">↗</button>

                <!-- Row 4, 5, 6 -->
                <button class="btn d-left" data-key="ArrowLeft">◀</button>
                <div class="drag-handle"></div>
                <button class="btn d-right" data-key="ArrowRight">▶</button>

                <!-- Row 1, 2, 3 -->
                <button class="btn action-a" data-key="z">A</button>
                <button class="btn d-down" data-key="ArrowDown">▼</button>
                <button class="btn action-b" data-key="x">B</button>
            </div>
        </div>
    </div>

    <div id="share-confirm-overlay" class="state-hidden" hidden>
        <div class="share-confirm-dialog">
            <h2 id="share-confirm-title">MAP SHARE</h2>
            <p id="share-confirm-message">マップ画像をクリップボードにコピーしました。
X を開いて貼り付けますか？</p>
            <div class="share-confirm-actions">
                <button id="share-confirm-x-btn" class="primary" type="button">OPEN X</button>
                <button id="share-confirm-close-btn" type="button">CLOSE</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
</body>

</html>
